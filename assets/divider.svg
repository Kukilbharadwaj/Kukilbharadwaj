<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#7C3AED" stop-opacity="0.95"/>
      <stop offset="82%"  stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="5" width="1000" height="2" rx="1" fill="url(#dline)"/>
  <rect y="4" width="220" height="4" rx="2" fill="url(#shine)" opacity="0.55">
    <animate attributeName="x" from="-220" to="1000" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <circle cy="6" r="3.2" fill="#00E5FF">
    <animate attributeName="cx" from="-10" to="1010" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite"/>
  </circle>
</svg>
