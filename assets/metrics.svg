<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="Impact metrics">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F1A"/><stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/><stop offset="100%" stop-color="#2ea44f"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5C542"/><stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="medge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.65"/><stop offset="100%" stop-color="#7C3AED" stop-opacity="0.65"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .lbl  { font-size:13px; fill:#8FA6C4 } .val { font-size:15px; font-weight:700 }
      .sub  { font-size:10.5px; fill:#5A6B85; letter-spacing:1.6px }
      @keyframes fin { to { opacity:1 } }
      .fin { opacity:0; animation: fin .5s ease-out forwards }
    </style>
  </defs>

  <rect x="1" y="1" width="938" height="298" rx="14" fill="url(#mbg)" stroke="url(#medge)" stroke-width="1.3"/>

  <text class="mono sub" x="28" y="34">PRODUCTION&#160;IMPACT&#160;&#160;&#183;&#160;&#160;MEASURED,&#160;NOT&#160;CLAIMED</text>
  <path d="M28 46 H912" stroke="#1D2A40" stroke-width="1"/>

  <!-- row 1 -->
  <text class="mono lbl" x="28" y="82">Query resolution accuracy</text>
  <rect x="330" y="70" width="480" height="14" rx="7" fill="#162034"/>
  <rect x="330" y="70" width="0" height="14" rx="7" fill="url(#g1)">
    <animate attributeName="width" from="0" to="408" dur="1.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <g class="fin" style="animation-delay:1.2s">
    <path d="M618 64 V90" stroke="#0B0F1A" stroke-width="3"/>
    <path d="M618 64 V90" stroke="#8FA6C4" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text class="mono" x="618" y="60" font-size="9.5" fill="#5A6B85" text-anchor="middle">baseline 60%</text>
  </g>
  <text class="mono val fin" x="826" y="82" fill="#2ea44f" style="animation-delay:1.5s">60% &#8594; 85%</text>

  <!-- row 2 -->
  <text class="mono lbl" x="28" y="122">Human-escalated support queries</text>
  <rect x="330" y="110" width="480" height="14" rx="7" fill="#162034"/>
  <rect x="330" y="110" width="0" height="14" rx="7" fill="url(#g2)">
    <animate attributeName="width" from="0" to="216" dur="1.5s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text class="mono val fin" x="826" y="122" fill="#00E5FF" style="animation-delay:1.7s">&#8722;45%</text>

  <!-- row 3 -->
  <text class="mono lbl" x="28" y="162">Document workflow efficiency</text>
  <rect x="330" y="150" width="480" height="14" rx="7" fill="#162034"/>
  <rect x="330" y="150" width="0" height="14" rx="7" fill="url(#g3)">
    <animate attributeName="width" from="0" to="192" dur="1.5s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text class="mono val fin" x="826" y="162" fill="#F5C542" style="animation-delay:1.9s">+40%</text>

  <!-- row 4 -->
  <text class="mono lbl" x="28" y="202">Multi-step task completion</text>
  <rect x="330" y="190" width="480" height="14" rx="7" fill="#162034"/>
  <rect x="330" y="190" width="0" height="14" rx="7" fill="url(#g1)">
    <animate attributeName="width" from="0" to="432" dur="1.5s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <text class="mono val fin" x="826" y="202" fill="#2ea44f" style="animation-delay:2.1s">90%</text>

  <path d="M28 226 H912" stroke="#1D2A40" stroke-width="1"/>

  <!-- stat tiles -->
  <g class="fin" style="animation-delay:2.2s">
    <text class="mono" x="28"  y="262" font-size="24" font-weight="700" fill="#E8EEF7">10K+</text>
    <text class="mono sub" x="28"  y="280">QUERIES / MONTH</text>

    <text class="mono" x="248" y="262" font-size="24" font-weight="700" fill="#E8EEF7">&lt;4s</text>
    <text class="mono sub" x="248" y="280">AGENT p99 LATENCY</text>

    <text class="mono" x="468" y="262" font-size="24" font-weight="700" fill="#E8EEF7">&lt;1s</text>
    <text class="mono sub" x="468" y="280">SEMANTIC SEARCH</text>

    <text class="mono" x="688" y="262" font-size="24" font-weight="700" fill="#E8EEF7">TOP 5</text>
    <text class="mono sub" x="688" y="280">OF 200+ TEAMS</text>
  </g>
</svg>
