<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img" aria-label="GitHub statistics for Kukilbharadwaj">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F1A"/><stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="sedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.65"/>
    </linearGradient>
    <clipPath id="barclip"><rect x="500" y="126" width="412" height="16" rx="8"/></clipPath>
    <clipPath id="reveal"><rect x="500" y="126" width="0" height="16">
      <animate attributeName="width" from="0" to="412" dur="1.4s" begin="0.8s" fill="freeze"
               calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </rect></clipPath>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .lbl { font-size:13.5px; fill:#8FA6C4 }
      .val { font-size:17px; font-weight:700; fill:#E8EEF7 }
      .leg { font-size:12.5px; fill:#C6D4E6 }
      .hdr { font-size:10.5px; fill:#5A6B85; letter-spacing:2.4px }
      @keyframes fin { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:translateY(0) } }
      .fin { opacity:0; animation: fin .5s ease-out forwards }
    </style>
  </defs>

  <rect x="1" y="1" width="938" height="298" rx="14" fill="url(#sbg)" stroke="url(#sedge)" stroke-width="1.3"/>

  <text class="mono hdr" x="28" y="34">GITHUB&#160;&#183;&#160;LIVE&#160;STATS</text>
  <text class="mono hdr" x="912" y="34" text-anchor="end">SYNCED&#160;04 AUG 2026</text>
  <path d="M28 46 H912" stroke="#1D2A40" stroke-width="1"/>
  <path d="M470 62 V272" stroke="#1D2A40" stroke-width="1"/>

  <text class="mono hdr" x="28" y="70" fill="#00E5FF">ACTIVITY</text>
  <g class="fin" style="animation-delay:0.35s">
    <circle cx="34" cy="87" r="3" fill="#00E5FF" opacity="0.8"/>
    <text class="mono lbl" x="50" y="92">Public repositories</text>
    <text class="mono val" x="424" y="92" text-anchor="end">17</text>
  </g>
  <g class="fin" style="animation-delay:0.47s">
    <circle cx="34" cy="125" r="3" fill="#00E5FF" opacity="0.8"/>
    <text class="mono lbl" x="50" y="130">Total stars earned</text>
    <text class="mono val" x="424" y="130" text-anchor="end">0</text>
  </g>
  <g class="fin" style="animation-delay:0.59s">
    <circle cx="34" cy="163" r="3" fill="#00E5FF" opacity="0.8"/>
    <text class="mono lbl" x="50" y="168">Total forks</text>
    <text class="mono val" x="424" y="168" text-anchor="end">1</text>
  </g>
  <g class="fin" style="animation-delay:0.71s">
    <circle cx="34" cy="201" r="3" fill="#00E5FF" opacity="0.8"/>
    <text class="mono lbl" x="50" y="206">Followers</text>
    <text class="mono val" x="424" y="206" text-anchor="end">10</text>
  </g>
  <g class="fin" style="animation-delay:0.83s">
    <circle cx="34" cy="239" r="3" fill="#00E5FF" opacity="0.8"/>
    <text class="mono lbl" x="50" y="244">Commits (last year)</text>
    <text class="mono val" x="424" y="244" text-anchor="end">480</text>
  </g>

  <text class="mono hdr" x="500" y="70" fill="#7C3AED">TOP LANGUAGES</text>
  <rect x="500" y="126" width="412" height="16" rx="8" fill="#162034"/>
  <g clip-path="url(#barclip)"><g clip-path="url(#reveal)">
    <rect x="500.0" y="126" width="357.1" height="16" fill="#3572A5"/>
    <rect x="857.1" y="126" width="54.9" height="16" fill="#DA5B0B"/>
  </g></g>
  <text class="mono hdr" x="500" y="112">PRIMARY LANGUAGE ACROSS 15 PUBLIC REPOSITORIES</text>
  <g class="fin" style="animation-delay:1.10s">
    <circle cx="505" cy="178" r="5" fill="#3572A5"/>
    <text class="mono leg" x="518" y="182">Python</text>
    <text class="mono leg" x="696" y="182" text-anchor="end" fill="#8FA6C4">86.7%</text>
  </g>
  <g class="fin" style="animation-delay:1.20s">
    <circle cx="717" cy="178" r="5" fill="#DA5B0B"/>
    <text class="mono leg" x="730" y="182">Jupyter Notebook</text>
    <text class="mono leg" x="908" y="182" text-anchor="end" fill="#8FA6C4">13.3%</text>
  </g>

  <text class="mono hdr" x="28" y="286" fill="#3E4C63">GENERATED BY scripts/gen_stats.py &#183; NO THIRD-PARTY SERVICE</text>
</svg>
