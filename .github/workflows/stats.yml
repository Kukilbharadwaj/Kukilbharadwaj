name: Refresh GitHub Stats Card

on:
  schedule:
    - cron: "30 2 * * *"    # daily, 02:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gen_stats.py"
      - ".github/workflows/stats.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_stats.py ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet || git commit -m "chore: refresh stats card [skip ci]"
          git push
